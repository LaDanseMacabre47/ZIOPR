stages:
  - build
  - installer

# ================================================================
#  —борка проекта
# ================================================================
build:
  stage: build
  tags:
    - bks2301
  script:
    - cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
    - cmake --build build --config Release
  artifacts:
    paths:
      - build/bin/Release/TrayService.exe
      - build/bin/Release/TrayApp.exe
    expire_in: 1 day

# ================================================================
#  —борка инсталл€тора NSIS
# ================================================================
installer:
  stage: installer
  tags:
    - bks2301
  needs:
    - build
  script:
    - mkdir -Force installer\bin
    - mkdir -Force installer\redist
    - Copy-Item build\bin\Release\TrayService.exe installer\bin\TrayService.exe
    - Copy-Item build\bin\Release\TrayApp.exe installer\bin\TrayApp.exe
    - |
      if (-not (Test-Path "installer\redist\VC_redist.x64.exe")) {
        Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
          -OutFile "installer\redist\VC_redist.x64.exe"
      }
    - '& "C:\Program Files (x86)\NSIS\makensis.exe" /V2 installer\TrayApp.nsi'
  artifacts:
    paths:
      - installer/TrayApp-Setup.exe
    expire_in: 1 week